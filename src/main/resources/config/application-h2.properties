# Profile H2 para desenvolvimento local em memória (rápido e sem lock de arquivo)
# Use o H2 Console com a mesma URL abaixo para inspecionar: jdbc:h2:mem:ifence
spring.datasource.url=jdbc:h2:mem:ifence;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Não recriar o schema a cada start; ajustar incrementos conforme entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Flyway desabilitado no perfil H2 (evita conflito com H2 2.x); Hibernate fará update do schema
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Desabilita constraints que o H2 não suporta exatamente como Postgres (serão ajustadas pelas migrations quando possível)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# Log reduzido
logging.level.root=INFO
