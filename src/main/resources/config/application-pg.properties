# Profile PostgreSQL (desenvolvimento com Postgres local ou Docker)

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ifence
spring.datasource.username=dev_ifence
spring.datasource.password=dev_ifence123
spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Em desenvolvimento, permitir que o Hibernate crie/atualize o schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway pode ser ligado depois que as migrations estiverem organizadas
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# JSON strict
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true
spring.jackson.deserialization.fail-on-unknown-properties=true
